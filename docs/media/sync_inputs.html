<style>
  .sync-fig {
    width: 100%;
    max-width: 960px;
    height: auto;
    display: block;
    margin: 0.5em auto 1.5em;
    font-family: inherit;
  }
  .sync-fig {
    --sf-ink: #404040;
    --sf-muted: #6a6a6a;
    --sf-none: #c9c9c9;
    --sf-bg: #fcfcfc;
    --sf-tb: #5b4bc4;
    --sf-ar: #c4651a;
  }
  html[data-theme="dark"] .sync-fig {
    --sf-ink: #c1c1c1;
    --sf-muted: #8f8f8f;
    --sf-none: #3a3a3a;
    --sf-bg: #141414;
    --sf-tb: #a99cf0;
    --sf-ar: #f0a25a;
  }
  .sync-fig text {
    font-family: inherit;
  }
  .sync-fig .sf-label {
    font-size: 19px;
    font-weight: 700;
    fill: var(--sf-ink);
  }
  .sync-fig .sf-label-n {
    font-size: 17px;
    fill: var(--sf-ink);
  }
  .sync-fig .sf-sub {
    font-size: 16px;
    fill: var(--sf-muted);
  }
  .sync-fig .sf-note {
    font-size: 16px;
    fill: var(--sf-muted);
    font-style: italic;
  }
  .sync-fig .sf-tbtext {
    fill: var(--sf-tb);
  }
  .sync-fig .sf-tb {
    stroke: var(--sf-tb);
    fill: none;
  }
  .sync-fig .sf-ar {
    stroke: var(--sf-ar);
    fill: none;
  }
  .sync-fig .sf-base {
    stroke-width: 1;
    opacity: 0.55;
  }
  .sync-fig .sf-tick {
    stroke-width: 1.2;
  }
  .sync-fig .sf-step {
    stroke-width: 1.6;
    stroke-linejoin: miter;
  }
  .sync-fig .sf-led {
    fill: var(--sf-ar);
    fill-opacity: 0.3;
  }
  .sync-fig .sf-none {
    stroke: var(--sf-none);
    stroke-width: 1;
    stroke-dasharray: 2 3;
  }
  .sync-fig .sf-bg {
    fill: var(--sf-bg);
  }
  .sync-fig .sf-break {
    stroke: var(--sf-muted);
    stroke-width: 1.2;
  }
  .sync-fig .sf-mark {
    stroke: var(--sf-ink);
    stroke-width: 1;
    stroke-dasharray: 4 4;
  }
  .sync-fig .sf-muted-line {
    stroke: var(--sf-muted);
    stroke-width: 1;
  }
  .sync-fig .sf-bracket {
    stroke-width: 1;
  }
  .sync-fig .sf-scale {
    stroke: var(--sf-ink);
    stroke-width: 2;
  }
  .sync-fig .sf-arrow-tb {
    fill: var(--sf-tb);
  }
  .sync-fig .sf-arrow {
    fill: var(--sf-muted);
  }
  .sync-fig .sf-zoombox {
    fill: none;
    stroke: var(--sf-ink);
    stroke-width: 1.2;
    stroke-dasharray: 3 2;
  }
</style>
